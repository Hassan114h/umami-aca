name: Build and Deploy Container App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v2
    - uses: azure/docker-login@v1
      with:
        login-server: acrumami-hxgdgxccgnd6gted.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - run: |
        docker buildx build --platform linux/amd64 --provenance=false --sbom=false -f umami/Dockerfile -t acrumami-hxgdgxccgnd6gted.azurecr.io/umami:v1 umami
        docker push acrumami-hxgdgxccgnd6gted.azurecr.io/umami:v1 
